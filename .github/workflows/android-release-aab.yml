name: Android Signed AAB

on:
  workflow_dispatch:
    inputs:
      android_version_code:
        description: Android version code to build
        required: false
        default: '20'
      android_version_name:
        description: Android version name to build
        required: false
        default: '1.2.1'

jobs:
  build-signed-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        env:
          NODE_ENV: development
          NPM_CONFIG_PRODUCTION: "false"
        run: npm ci --include=dev

      - name: Ensure CSS build dependencies exist
        shell: bash
        run: |
          set -euo pipefail
          if ! npm ls tailwindcss --depth=0 >/dev/null 2>&1; then
            echo "tailwindcss missing after npm ci; installing fallback CSS toolchain"
            npm install --no-save --include=dev tailwindcss postcss autoprefixer
          fi
          npm ls tailwindcss --depth=0

      - name: Validate Android signing secrets
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for key in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Create frontend .env.production
        shell: bash
        env:
          ANDROID_FRONTEND_ENV_PRODUCTION_BASE64: ${{ vars.ANDROID_FRONTEND_ENV_PRODUCTION_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_FRONTEND_ENV_PRODUCTION_BASE64:-}" ]; then
            echo "Missing required repository variable: ANDROID_FRONTEND_ENV_PRODUCTION_BASE64"
            exit 1
          fi

          echo "$ANDROID_FRONTEND_ENV_PRODUCTION_BASE64" | base64 --decode > .env.production

          for key in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            if ! grep -Eq "^${key}=.+" .env.production; then
              echo "Missing required key in .env.production: $key"
              exit 1
            fi
          done

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Decode Android upload keystore
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/keystore.jks
          ls -l /tmp/keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}

      - name: Decode Firebase google-services.json
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          ls -l android/app/google-services.json
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Resolve Android version inputs
        id: resolve_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="24"
          VERSION_NAME="1.2.5"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved Android versionCode=$VERSION_CODE versionName=$VERSION_NAME"

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ steps.resolve_version.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.resolve_version.outputs.version_name }}
          KEYSTORE_PATH: /tmp/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_STORE_FILE: /tmp/keystore.jks
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon -PANDROID_VERSION_CODE=$ANDROID_VERSION_CODE -PANDROID_VERSION_NAME=$ANDROID_VERSION_NAME

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
