name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cloudbuild_config:
        description: Cloud Build config file
        required: false
        default: cloudbuild.yaml
      substitutions:
        description: Optional Cloud Build substitutions string (comma-separated _KEY=value)
        required: false
        default: ''

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ secrets.GCP_SA_KEY != '' && secrets.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Submit Cloud Build
        shell: bash
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          CONFIG_FILE: ${{ github.event.inputs.cloudbuild_config || 'cloudbuild.yaml' }}
          SUBSTITUTIONS: ${{ github.event.inputs.substitutions || '' }}
        run: |
          set -euo pipefail

          if [ -n "$SUBSTITUTIONS" ]; then
            gcloud builds submit . \
              --project "$PROJECT_ID" \
              --config "$CONFIG_FILE" \
              --substitutions "$SUBSTITUTIONS"
          else
            gcloud builds submit . \
              --project "$PROJECT_ID" \
              --config "$CONFIG_FILE"
          fi

  skipped-missing-secrets:
    if: ${{ !(secrets.GCP_SA_KEY != '' && secrets.GCP_PROJECT_ID != '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Missing GCP secrets
        run: |
          echo "Skipping production deploy workflow because GCP_SA_KEY or GCP_PROJECT_ID is not configured."