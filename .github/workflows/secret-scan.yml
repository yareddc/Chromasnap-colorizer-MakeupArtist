name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if tracked .env files exist
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "Root .env is tracked. Move secrets to runtime env/Secret Manager and untrack this file."
            exit 1
          fi
          if git ls-files --error-unmatch server/.env >/dev/null 2>&1; then
            echo "server/.env is tracked. Move secrets to runtime env/Secret Manager and untrack this file."
            exit 1
          fi
          if git ls-files 'server/config/*.json' | grep -q .; then
            echo "Service-account JSON files are tracked under server/config/. Untrack and use Secret Manager/ADC."
            exit 1
          fi

      - name: Run gitleaks (workspace scan)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-git --redact --config .gitleaks.toml
