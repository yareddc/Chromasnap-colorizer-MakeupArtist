plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def firstNonEmpty = { List<String> values ->
    def match = values.find { value ->
        value != null && value.toString().trim()
    }
    return match == null ? '' : match.toString().trim()
}

def releaseStoreFile = firstNonEmpty([
    System.getenv('KEYSTORE_PATH'),
    System.getenv('ANDROID_UPLOAD_STORE_FILE'),
    project.findProperty('KEYSTORE_PATH')?.toString(),
    project.findProperty('ANDROID_UPLOAD_STORE_FILE')?.toString(),
])
def releaseStorePassword = firstNonEmpty([
    System.getenv('KEYSTORE_PASSWORD'),
    System.getenv('ANDROID_UPLOAD_STORE_PASSWORD'),
    project.findProperty('KEYSTORE_PASSWORD')?.toString(),
    project.findProperty('ANDROID_UPLOAD_STORE_PASSWORD')?.toString(),
])
def releaseKeyAlias = firstNonEmpty([
    System.getenv('KEY_ALIAS'),
    System.getenv('ANDROID_UPLOAD_KEY_ALIAS'),
    project.findProperty('KEY_ALIAS')?.toString(),
    project.findProperty('ANDROID_UPLOAD_KEY_ALIAS')?.toString(),
])
def releaseKeyPassword = firstNonEmpty([
    System.getenv('KEY_PASSWORD'),
    System.getenv('ANDROID_UPLOAD_KEY_PASSWORD'),
    project.findProperty('KEY_PASSWORD')?.toString(),
    project.findProperty('ANDROID_UPLOAD_KEY_PASSWORD')?.toString(),
])
def hasReleaseSigningConfig = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def releaseVersionCode = firstNonEmpty([
    System.getenv('ANDROID_VERSION_CODE'),
    project.findProperty('ANDROID_VERSION_CODE')?.toString(),
])
def releaseVersionName = firstNonEmpty([
    System.getenv('ANDROID_VERSION_NAME'),
    project.findProperty('ANDROID_VERSION_NAME')?.toString(),
])

android {
    namespace = "com.chromasnap.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.chromasnap.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ((releaseVersionCode?.isInteger() ? releaseVersionCode.toInteger() : 6))
        versionName (releaseVersionName ?: "1.2.1")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV3Signing true
                enableV4Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def needsReleaseSigning = graph.allTasks.any {
        it.path == ':app:bundleRelease' || it.path == ':app:assembleRelease' || it.path == ':app:packageRelease'
    }

    if (needsReleaseSigning && !hasReleaseSigningConfig) {
        throw new GradleException('Missing Android upload signing config. Set KEYSTORE_PATH/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD (or ANDROID_UPLOAD_STORE_FILE/ANDROID_UPLOAD_STORE_PASSWORD/ANDROID_UPLOAD_KEY_ALIAS/ANDROID_UPLOAD_KEY_PASSWORD).')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.facebook.android:facebook-login:18.1.3'
    implementation "com.android.billingclient:billing:7.1.1"
    implementation platform('com.google.firebase:firebase-bom:34.11.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
