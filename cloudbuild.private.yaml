substitutions:
  _SERVICE: chromasnap-server
  _REGION: us-central1
  _GCP_LOCATION: us-central1
  _CORS_ORIGINS: https://chromasnap.app,https://www.chromasnap.app
  _VIDEO_MODEL_CANDIDATES: veo-3.1-fast-generate-preview,veo-3.1-generate-preview,veo-3.0-fast-generate-001,veo-3.0-generate-001,veo-2.0-generate-001
  _USER_DB_GCS_BUCKET: chrommasnap-vertex-ai-use-user-db
  _USER_DB_GCS_OBJECT: usernames.db
  _ANIMATION_POLL_INTERVAL_MS: '2000'
  _ANIMATION_MAX_WAIT_MS_PER_MODEL: '120000'
  _ANIMATION_MAX_TOTAL_WAIT_MS: '180000'
  _PASSWORD_RESET_WEBHOOK_URL: https://chromasnap-password-reset-webhook-757124892696.us-central1.run.app/password-reset

  # Secret Manager secret names (create these in your GCP project first)
  _SECRET_GEMINI_API_KEY: GEMINI_API_KEY
  _SECRET_JWT_SECRET: JWT_SECRET
  _SECRET_ADMIN_API_KEY: ADMIN_API_KEY
  _SECRET_CAPTCHA_SECRET_KEY: CAPTCHA_SECRET_KEY
  _SECRET_CAPTCHA_BYPASS_TOKEN: CAPTCHA_BYPASS_TOKEN
  _SECRET_PASSWORD_RESET_WEBHOOK_SHARED_SECRET: PASSWORD_RESET_WEBHOOK_SHARED_SECRET

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: validate-auth-secrets
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "Validating required auth secrets in Secret Manager..."

        validate_secret() {
          local secret_name="$1"
          local min_length="$2"
          local allow_google_api_key="$3"
          local tmp_file
          tmp_file="$$(mktemp)"

          gcloud secrets versions access latest --secret="$$secret_name" --project="$PROJECT_ID" > "$$tmp_file"

          local raw_length
          raw_length="$$(wc -c < "$$tmp_file" | tr -d ' ')"
          local normalized_value
          normalized_value="$$(tr -d '\r\n' < "$$tmp_file")"
          local normalized_length="$${#normalized_value}"

          if [ "$${raw_length}" -ne "$${normalized_length}" ]; then
            echo "ERROR: $$secret_name contains trailing newline characters; store it without CR/LF"
            exit 1
          fi

          if [ -z "$${normalized_value}" ]; then
            echo "ERROR: $$secret_name latest version is empty"
            exit 1
          fi

          if [ "$${normalized_length}" -lt "$${min_length}" ]; then
            echo "ERROR: $$secret_name must be at least $$min_length characters"
            exit 1
          fi

          if [ "$${allow_google_api_key}" != "true" ] && [[ "$${normalized_value}" =~ ^AIza[0-9A-Za-z_-]{20,}$$ ]]; then
            echo "ERROR: $$secret_name cannot be a Google API key"
            exit 1
          fi
        }

        validate_secret "$_SECRET_GEMINI_API_KEY" 20 true
        validate_secret "$_SECRET_JWT_SECRET" 32 false
        validate_secret "$_SECRET_ADMIN_API_KEY" 24 false
        validate_secret "$_SECRET_CAPTCHA_SECRET_KEY" 20 false
        validate_secret "$_SECRET_CAPTCHA_BYPASS_TOKEN" 12 false
        validate_secret "$_SECRET_PASSWORD_RESET_WEBHOOK_SHARED_SECRET" 32 false

        echo "Secret validation passed."

  - name: gcr.io/cloud-builders/docker
    id: build-image
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/$_SERVICE:$BUILD_ID
      - -t
      - gcr.io/$PROJECT_ID/$_SERVICE:latest
      - .
    waitFor:
      - validate-auth-secrets

  - name: gcr.io/cloud-builders/docker
    id: push-build-id-image
    args:
      - push
      - gcr.io/$PROJECT_ID/$_SERVICE:$BUILD_ID
    waitFor:
      - build-image

  - name: gcr.io/cloud-builders/docker
    id: push-latest-image
    args:
      - push
      - gcr.io/$PROJECT_ID/$_SERVICE:latest
    waitFor:
      - build-image

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-cloud-run
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image
      - gcr.io/$PROJECT_ID/$_SERVICE:$BUILD_ID
      - --region
      - $_REGION
      - --platform
      - managed
      - --no-iap
      - --allow-unauthenticated
      - --set-env-vars
      - ^|^NODE_ENV=production|GCP_PROJECT_ID=$PROJECT_ID|GCP_LOCATION=$_GCP_LOCATION|ALLOW_HEADER_BILLING_ID=false|CORS_ORIGINS=$_CORS_ORIGINS|VIDEO_MODEL_CANDIDATES=$_VIDEO_MODEL_CANDIDATES|USER_DB_GCS_BUCKET=$_USER_DB_GCS_BUCKET|USER_DB_GCS_OBJECT=$_USER_DB_GCS_OBJECT|ANIMATION_POLL_INTERVAL_MS=$_ANIMATION_POLL_INTERVAL_MS|ANIMATION_MAX_WAIT_MS_PER_MODEL=$_ANIMATION_MAX_WAIT_MS_PER_MODEL|ANIMATION_MAX_TOTAL_WAIT_MS=$_ANIMATION_MAX_TOTAL_WAIT_MS|PASSWORD_RESET_WEBHOOK_URL=$_PASSWORD_RESET_WEBHOOK_URL|PASSWORD_RESET_WEBHOOK_TIMEOUT_MS=10000
      - --set-secrets
      - GEMINI_API_KEY=$_SECRET_GEMINI_API_KEY:latest,JWT_SECRET=$_SECRET_JWT_SECRET:latest,ADMIN_API_KEY=$_SECRET_ADMIN_API_KEY:latest,CAPTCHA_SECRET_KEY=$_SECRET_CAPTCHA_SECRET_KEY:latest,CAPTCHA_BYPASS_TOKEN=$_SECRET_CAPTCHA_BYPASS_TOKEN:latest,PASSWORD_RESET_WEBHOOK_SHARED_SECRET=$_SECRET_PASSWORD_RESET_WEBHOOK_SHARED_SECRET:latest
    waitFor:
      - push-build-id-image
      - push-latest-image

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: capture-service-url
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run services describe "$_SERVICE" --region "$_REGION" --platform managed --format="value(status.url)" > /workspace/.cloudrun-url
        gcloud auth print-identity-token > /workspace/.identity-token || true
        echo "Captured deployed service URL: $$(cat /workspace/.cloudrun-url)"
    waitFor:
      - deploy-cloud-run

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: post-deploy-health-check
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SERVICE_URL="$$(cat /workspace/.cloudrun-url)"
        ID_TOKEN="$$(cat /workspace/.identity-token 2>/dev/null || true)"

        AUTH_HEADER=()
        if [ -n "$$ID_TOKEN" ]; then
          AUTH_HEADER=(-H "X-Serverless-Authorization: Bearer $$ID_TOKEN")
        fi

        echo "Checking $$SERVICE_URL/health"
        curl --fail --silent --show-error "$${AUTH_HEADER[@]}" "$$SERVICE_URL/health"
    waitFor:
      - capture-service-url

  - name: node:20
    id: post-deploy-smoke-tests
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SERVICE_URL="$$(cat /workspace/.cloudrun-url)"
        ID_TOKEN="$$(cat /workspace/.identity-token 2>/dev/null || true)"
        cd /workspace/server
        npm ci --no-audit --fund=false
        AUTH_SMOKE_BASE_URL="$$SERVICE_URL" AUTH_SMOKE_ID_TOKEN="$$ID_TOKEN" node scripts/smoke-auth-cookie.mjs
        BILLING_SMOKE_BASE_URL="$$SERVICE_URL" BILLING_SMOKE_ID_TOKEN="$$ID_TOKEN" BILLING_EXPECT_DIRECT_MUTATION_BLOCKED=1 node scripts/smoke-billing.mjs
    waitFor:
      - post-deploy-health-check

images:
  - gcr.io/$PROJECT_ID/$_SERVICE:$BUILD_ID
  - gcr.io/$PROJECT_ID/$_SERVICE:latest
