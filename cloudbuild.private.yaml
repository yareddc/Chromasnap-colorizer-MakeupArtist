substitutions:
  _SERVICE: chromasnap-server
  _REGION: us-central1
  _GCP_LOCATION: us-central1
  _CORS_ORIGINS: https://chromasnap.app,https://www.chromasnap.app
  _VIDEO_MODEL_CANDIDATES: veo-3.1-fast-generate-preview,veo-3.1-generate-preview,veo-3.0-fast-generate-001,veo-3.0-generate-001,veo-2.0-generate-001
  _USER_DB_GCS_BUCKET: chrommasnap-vertex-ai-use-user-db
  _USER_DB_GCS_OBJECT: usernames.db
  _ANIMATION_POLL_INTERVAL_MS: '2000'
  _ANIMATION_MAX_WAIT_MS_PER_MODEL: '120000'
  _ANIMATION_MAX_TOTAL_WAIT_MS: '180000'

  # Secret Manager secret names (create these in your GCP project first)
  _SECRET_GEMINI_API_KEY: GEMINI_API_KEY
  _SECRET_JWT_SECRET: JWT_SECRET
  _SECRET_ADMIN_API_KEY: ADMIN_API_KEY
  _SECRET_CAPTCHA_SECRET_KEY: CAPTCHA_SECRET_KEY
  _SECRET_CAPTCHA_BYPASS_TOKEN: CAPTCHA_BYPASS_TOKEN

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: validate-auth-secrets
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "Validating required auth secrets in Secret Manager..."

        JWT_VALUE="$(gcloud secrets versions access latest --secret="$_SECRET_JWT_SECRET" --project="$PROJECT_ID" | tr -d '\r')"
        ADMIN_VALUE="$(gcloud secrets versions access latest --secret="$_SECRET_ADMIN_API_KEY" --project="$PROJECT_ID" | tr -d '\r')"

        if [ -z "${JWT_VALUE}" ]; then
          echo "ERROR: $_SECRET_JWT_SECRET latest version is empty"
          exit 1
        fi

        if [ -z "${ADMIN_VALUE}" ]; then
          echo "ERROR: $_SECRET_ADMIN_API_KEY latest version is empty"
          exit 1
        fi

        if [ ${#JWT_VALUE} -lt 32 ]; then
          echo "ERROR: $_SECRET_JWT_SECRET must be at least 32 characters"
          exit 1
        fi

        if [ ${#ADMIN_VALUE} -lt 24 ]; then
          echo "ERROR: $_SECRET_ADMIN_API_KEY must be at least 24 characters"
          exit 1
        fi

        if [[ "$JWT_VALUE" =~ ^AIza[0-9A-Za-z_-]{20,}$ ]]; then
          echo "ERROR: $_SECRET_JWT_SECRET cannot be a Google API key"
          exit 1
        fi

        if [[ "$ADMIN_VALUE" =~ ^AIza[0-9A-Za-z_-]{20,}$ ]]; then
          echo "ERROR: $_SECRET_ADMIN_API_KEY cannot be a Google API key"
          exit 1
        fi

        echo "Secret validation passed."

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/$_SERVICE:$BUILD_ID
      - -t
      - gcr.io/$PROJECT_ID/$_SERVICE:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/$_SERVICE:$BUILD_ID

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/$_SERVICE:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image
      - gcr.io/$PROJECT_ID/$_SERVICE:$BUILD_ID
      - --region
      - $_REGION
      - --platform
      - managed
      - --no-iap
      - --no-allow-unauthenticated
      - --set-env-vars
      - ^|^NODE_ENV=production|GCP_PROJECT_ID=$PROJECT_ID|GCP_LOCATION=$_GCP_LOCATION|ALLOW_HEADER_BILLING_ID=false|CORS_ORIGINS=$_CORS_ORIGINS|VIDEO_MODEL_CANDIDATES=$_VIDEO_MODEL_CANDIDATES|USER_DB_GCS_BUCKET=$_USER_DB_GCS_BUCKET|USER_DB_GCS_OBJECT=$_USER_DB_GCS_OBJECT|ANIMATION_POLL_INTERVAL_MS=$_ANIMATION_POLL_INTERVAL_MS|ANIMATION_MAX_WAIT_MS_PER_MODEL=$_ANIMATION_MAX_WAIT_MS_PER_MODEL|ANIMATION_MAX_TOTAL_WAIT_MS=$_ANIMATION_MAX_TOTAL_WAIT_MS
      - --set-secrets
      - GEMINI_API_KEY=$_SECRET_GEMINI_API_KEY:latest,JWT_SECRET=$_SECRET_JWT_SECRET:latest,ADMIN_API_KEY=$_SECRET_ADMIN_API_KEY:latest,CAPTCHA_SECRET_KEY=$_SECRET_CAPTCHA_SECRET_KEY:latest,CAPTCHA_BYPASS_TOKEN=$_SECRET_CAPTCHA_BYPASS_TOKEN:latest

images:
  - gcr.io/$PROJECT_ID/$_SERVICE:$BUILD_ID
  - gcr.io/$PROJECT_ID/$_SERVICE:latest
